/* طبقة النقاط الخفيفة مثل تأثير الفيديو */
.window::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background-image:radial-gradient(rgba(255,255,255,.55) .8px,transparent 1px);
  background-size:7px 7px;opacity:.18;
  -webkit-mask-image:linear-gradient(180deg,#000 0,transparent 55%);mask-image:linear-gradient(180deg,#000 0,transparent 55%);
}

/* ===================== شاشة الدخول ===================== */
#login{
  position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  transition:opacity .7s ease, visibility .7s;
}
#login.hide{opacity:0;visibility:hidden}
.login-card{
  width:min(380px,92%);padding:30px 26px 22px;border-radius:22px;text-align:center;
  background:var(--glass-dark);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid rgba(255,255,255,.12);box-shadow:0 25px 60px rgba(0,0,0,.35);
  animation:pop .6s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.logo{
  width:52px;height:52px;margin:0 auto 14px;border-radius:14px;background:#fff;color:#1d2330;
  display:grid;place-items:center;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25)
}
.login-card h1{font-size:23px;font-weight:800;margin-bottom:6px}
.login-card .sub{font-size:13.5px;color:var(--muted);margin-bottom:18px;line-height:1.7}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.role{
  padding:10px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;transition:.2s
}
.role span{display:block;font-size:20px;margin-bottom:3px}
.role:hover{background:rgba(255,255,255,.14)}
.role.on{background:#fff;color:#1d2330;border-color:#fff}
.or{font-size:12px;color:var(--muted);margin:6px 0 10px}
.field{
  width:100%;padding:11px 14px;border-radius:12px;margin-bottom:9px;font-size:14.5px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;outline:none;transition:.2s
}
.field::placeholder{color:rgba(255,255,255,.5)}
.field:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,216,77,.18)}
.btn-main{
  margin-top:6px;padding:11px 26px;border-radius:999px;border:0;background:#fff;color:#1d2330;
  font-weight:800;font-size:15px;cursor:pointer;transition:.2s
}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.login-foot{margin-top:18px;font-size:12.5px;color:var(--muted)}
.login-foot b{color:#fff}
.terms{position:absolute;bottom:14px;width:100%;text-align:center;font-size:12px;color:#2b4d63;z-index:21;font-weight:700}
.err{color:#ffb3b3;font-size:12.5px;min-height:16px}

/* شاشة الترحيب الانتقالية */
#welcome{
  position:absolute;inset:0;z-index:19;display:flex;align-items:center;justify-content:center;
  background:rgba(20,26,34,.55);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:.6s;text-align:center;padding:20px
}
#welcome.show{opacity:1;visibility:visible}
#welcome h2{font-size:clamp(26px,4vw,44px);font-weight:800;line-height:1.5;max-width:760px;animation:pop .7s}

/* ===================== التطبيق ===================== */
#app{position:absolute;inset:0;display:flex;z-index:5;opacity:0;transition:opacity .7s}
#app.show{opacity:1}
.sidebar{
  width:62px;background:#0b0c10;display:flex;flex-direction:column;align-items:center;
  padding:14px 0;gap:6px;flex-shrink:0;z-index:6
}
.sidebar .s-logo{width:34px;height:34px;border-radius:9px;background:#fff;color:#111;display:grid;place-items:center;font-size:18px;margin-bottom:12px}
.nav{
  width:42px;height:42px;border-radius:12px;border:0;background:transparent;color:#cfd3dc;font-size:19px;cursor:pointer;
  position:relative;transition:.2s;display:grid;place-items:center
}
.nav:hover,.nav.on{background:#262a33}
.nav.on::before{content:"";position:absolute;right:-10px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--yellow)}
.nav .tip{
  position:absolute;right:52px;white-space:nowrap;background:#0b0c10;color:#fff;font-size:12.5px;padding:5px 10px;border-radius:8px;
  opacity:0;pointer-events:none;transition:.15s;font-weight:700
}
.nav:hover .tip{opacity:1}
.sidebar .spacer{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:conic-gradient(var(--pink),var(--yellow),var(--blue),var(--pink));display:grid;place-items:center;font-size:15px;cursor:pointer}

.main{flex:1;overflow-y:auto;position:relative;z-index:2;scroll-behavior:smooth}
.main::-webkit-scrollbar{width:8px}.main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:9px}
.topbar{
  position:sticky;top:0;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:10px;pointer-events:none
}
.topbar > *{pointer-events:auto}
.pill{
  display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-radius:999px;
  background:rgba(40,50,62,.55);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);font-size:13px;font-weight:700
}
.pill input{background:transparent;border:0;outline:none;color:#fff;width:0;transition:width .3s;font-size:13px}
.pill.open input{width:170px}
.pill input::placeholder{color:rgba(255,255,255,.6)}
.pill button{background:rgba(255,255,255,.12);border:0;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer}
.who{padding:7px 14px}
.content{max-width:720px;margin:0 auto;padding:4px 18px 60px}

/* البطاقات الزجاجية */
.card{
  background:var(--glass);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);
  border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px;margin-bottom:14px;
  box-shadow:0 8px 28px rgba(30,60,90,.12);animation:rise .5s both
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card-head{display:flex;width:fit-content;align-items:center;gap:10px;margin:22px 2px 8px;padding:5px 14px 5px 6px;border-radius:999px;background:rgba(24,34,46,.62);backdrop-filter:blur(10px);font-weight:800;font-size:15.5px;color:#fff;text-shadow:0 1px 6px rgba(20,50,80,.35)}
.badge{width:26px;height:26px;border-radius:7px;background:#fff;color:#111;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.desc{font-size:15px;line-height:1.8;margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.tags i{font-style:normal;margin-left:4px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat small{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat:last-child{text-align:left}
.chev{float:left;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:12px}

.hero{text-align:center;padding:26px 18px}
.hero h1{font-size:clamp(26px,4.4vw,40px);font-weight:800;line-height:1.35}
.hero h1 .c1{color:var(--yellow)}.hero h1 .c2{color:#ffb3d1}.hero h1{text-shadow:0 3px 0 rgba(20,40,70,.35)}
.hero p{color:var(--muted);margin-top:8px;font-size:15px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.person{background:rgba(255,255,255,.1);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;text-align:right}
.person .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.person small{display:block;color:var(--muted);font-size:12px}
.person b{font-size:15.5px}

.grid-sec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sec{
  border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;transition:.25s;
  background:rgba(255,255,255,.08);color:#fff
}
.sec:hover{transform:translateY(-4px) rotate(-1deg);background:rgba(255,255,255,.18)}
.sec .em{font-size:32px;display:block;margin-bottom:6px;animation:bob 3s ease-in-out infinite}
.sec:nth-child(2n) .em{animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-5px)}}
.sec b{font-size:14.5px}
.sec small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}

/* كتلة الكود (نموذج الكود كما في الفيديو) */
.code{
  background:rgba(18,22,28,.7);border-radius:14px;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.75;direction:ltr;text-align:left;color:#d8dee9;position:relative;overflow-x:auto;white-space:pre
}
.code .n{color:#6b7385;user-select:none;margin-right:12px}
.code .k{color:#ffd84d}.code .s{color:#9be28a}.code .c{color:#7d8799}
.copy{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:12px}

/* عناصر عامة */
.btn{padding:9px 16px;border-radius:999px;border:0;cursor:pointer;font-weight:800;font-size:14px;transition:.2s;background:#fff;color:#1d2330}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid var(--line)}
.btn.y{background:var(--yellow)}.btn.p{background:var(--pink)}.btn.g{background:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--line);color:#fff;cursor:pointer;font-weight:700;font-size:14px;transition:.2s}
.chip:hover{background:rgba(255,255,255,.22)}
.chip.ok{background:var(--green);color:#123;border-color:var(--green)}
.chip.no{background:#ff7a7a;border-color:#ff7a7a;animation:shake .4s}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.back{display:inline-flex;align-items:center;gap:6px;margin:6px 4px 4px;cursor:pointer;font-weight:800;font-size:14px;background:rgba(40,50,62,.5);padding:6px 14px;border-radius:999px;border:1px solid var(--line);color:#fff}
.mini{font-size:12.5px;color:var(--muted)}
.bar{height:10px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--yellow),var(--pink));transition:width 1s}
textarea.field{min-height:80px;resize:vertical}
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;z-index:99;
  background:#fff;color:#1d2330;padding:10px 22px;border-radius:999px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.35s
}
.toast.show{opacity:1;transform:translateX(-50%)}

/* آراء أولياء الأمور */
.op{background:rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.op .stars{color:var(--yellow);letter-spacing:2px}
.op p{font-size:14.5px;line-height:1.7;margin:4px 0}
.op small{color:var(--muted)}
.rate{display:flex;gap:4px;font-size:24px;cursor:pointer;margin-bottom:8px;direction:ltr;justify-content:flex-end}
.rate span{opacity:.35;transition:.15s}.rate span.on{opacity:1}

/* الفيديو القصصي */
.player{background:linear-gradient(160deg,#bfe6ff,#fff3c4);border-radius:16px;height:260px;position:relative;overflow:hidden;color:#1d2330}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;opacity:0;transition:opacity .6s}
.scene.on{opacity:1}
.scene .big{font-size:78px;animation:bob 2s ease-in-out infinite}
.scene p{font-size:19px;font-weight:800;margin-top:10px;line-height:1.6}
.scene p mark{background:var(--yellow);border-radius:6px;padding:0 6px}
.pctl{display:flex;align-items:center;gap:10px;margin-top:10px}
.pctl .bar{flex:1}

/* اللعبة ثلاثية الأبعاد */
.stage{
  height:330px;border-radius:18px;position:relative;overflow:hidden;perspective:900px;
  background:radial-gradient(circle at 50% 120%,#9ee37d 0 28%,transparent 29%),linear-gradient(180deg,#7fd0ff,#d9f3ff);
}
.cube-wrap{position:absolute;width:76px;height:76px;cursor:pointer;transition:transform .3s}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 7s linear infinite}
.cube-wrap:hover .cube{animation-play-state:paused}
@keyframes spin{from{transform:rotateX(-18deg) rotateY(0)}to{transform:rotateX(-18deg) rotateY(360deg)}}
.face{
  position:absolute;width:76px;height:76px;border-radius:14px;display:grid;place-items:center;
  font-size:26px;font-weight:800;color:#1d2330;border:3px solid rgba(255,255,255,.85);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)
}
.f1{transform:translateZ(38px)}.f2{transform:rotateY(90deg) translateZ(38px)}.f3{transform:rotateY(180deg) translateZ(38px)}
.f4{transform:rotateY(-90deg) translateZ(38px)}.f5{transform:rotateX(90deg) translateZ(38px)}.f6{transform:rotateX(-90deg) translateZ(38px)}
.floaty{animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px)}}
.burst{animation:burst .5s forwards}
@keyframes burst{to{transform:scale(1.8);opacity:0}}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hud .pill{background:rgba(255,255,255,.18)}
.target{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;color:#1d2330;border-radius:999px;
  padding:7px 18px;font-weight:800;font-size:18px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.15);white-space:nowrap
}
.cheer{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;color:#fff;text-shadow:0 4px 0 #f06b9f,0 8px 20px rgba(0,0,0,.25);pointer-events:none;opacity:0;z-index:6}
.cheer.go{animation:cheer 1s}
@keyframes cheer{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvl{border-radius:16px;padding:14px;text-align:center;cursor:pointer;color:#1d2330;font-weight:800;transition:.2s;border:0}
.lvl:hover{transform:translateY(-3px)}
.lvl.lock{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.lvl .em{font-size:30px;display:block}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:98;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* بطاقات الحروف */
.letters{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.lt{aspect-ratio:1;border-radius:12px;border:0;font-size:24px;font-weight:800;cursor:pointer;color:#1d2330;transition:.2s}
.lt:hover{transform:scale(1.08) rotate(-4deg)}
.story{background:#fffaf0;color:#1d2330;border-radius:16px;padding:18px;text-align:center;margin-top:12px}
.story .big{font-size:60px}
.story h3{font-size:26px;margin:4px 0}
.story p{font-size:17px;line-height:1.9}

/* أوراق العمل والتمارين */
.ws-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,.2);flex-wrap:wrap}
.ws-item:last-child{border:0}
.ws-item .w{font-size:20px;font-weight:800}
.slots{display:flex;gap:6px;justify-content:center;margin:10px 0;direction:rtl;min-height:58px}
.slot{width:52px;height:56px;border-radius:12px;border:2px dashed rgba(255,255,255,.6);display:grid;place-items:center;font-size:26px;font-weight:800}
.slot.f{background:#fff;color:#1d2330;border-style:solid}
.tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tile{width:52px;height:52px;border-radius:12px;border:0;background:var(--yellow);font-size:24px;font-weight:800;cursor:pointer;color:#1d2330;box-shadow:0 4px 0 #d9a91d}
.tile:disabled{opacity:.25}

/* الأسئلة */
.q{font-size:19px;font-weight:800;margin-bottom:12px;line-height:1.6}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.12);color:#fff;font-size:16px;font-weight:800;cursor:pointer;transition:.2s}
.opt:hover{background:rgba(255,255,255,.22)}
.opt.ok{background:var(--green);color:#123}.opt.no{background:#ff7a7a}

/* الشهادة */
canvas#cert{width:100%;border-radius:14px;background:#fff;display:block}

/* الجدول */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.15);text-align:right}
th{color:var(--yellow)}
.impact-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:14px}
.impact-row span{width:110px;flex-shrink:0}
.impact-row b{width:40px;text-align:left}

/* المنهج */
.units-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.unit{background:#fff;color:#1d2330;border-radius:18px;padding:14px;cursor:pointer;transition:.25s;border-bottom:6px solid var(--c);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.unit:hover{transform:translateY(-4px) rotate(-1deg)}
.unit .u-em{font-size:38px;background:color-mix(in srgb,var(--c) 35%,#fff);border-radius:14px;height:78px;display:grid;place-items:center;margin-bottom:8px}
.unit small{display:block;color:#7a5cff;font-weight:800;font-size:12.5px}.unit b{font-size:18px;display:block}.unit .mini{color:#6b7280}
.lessons{display:grid;gap:8px}
.lesson{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.14);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.2s}
.lesson:hover{background:rgba(255,255,255,.24)}.lesson>span:first-child{font-size:30px}.lesson small{display:block;color:var(--muted);font-size:12px}.lesson b{font-size:17px}.lesson .chev{margin-right:auto;float:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.tab{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(24,34,46,.55);color:#fff;font-weight:800;font-size:13.5px;cursor:pointer;backdrop-filter:blur(8px)}
.tab.on{background:#fff;color:#1d2330}
.wk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,.2)}
.wk p{font-size:14px;line-height:1.7;color:#fff;margin-top:2px}.wk b{color:var(--yellow)}
.wn{width:28px;height:28px;border-radius:50%;background:#fff8ec;color:#1d2330;display:grid;place-items:center;font-weight:800;flex-shrink:0;font-size:13px}
.sea{height:330px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(180deg,#bfe9ff 0 18%,#4fb6ef 18%,#2a8fd0)}
.boat{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:40px;animation:bob 2.5s ease-in-out infinite}
.fish{position:absolute;left:100%;display:flex;align-items:center;cursor:pointer;animation:swim linear infinite}
.fish .fbody{padding:8px 16px;border-radius:999px 60% 60% 999px;font-weight:800;color:#1d2330;border:2.5px solid #3b3340;font-size:17px;position:relative;white-space:nowrap}
.fish .ftail{width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:18px solid}
@keyframes swim{from{transform:translateX(0)}to{transform:translateX(calc(-100% - 760px))}}
.fish.burst{animation:burst .5s forwards}
.chip input{vertical-align:middle;margin-left:4px}
@media (max-width:760px){.unit .u-em{height:60px;font-size:30px}@keyframes swim{from{transform:translateX(0)}to{transform:translateX(calc(-100% - 420px))}}}

/* الأيقونات المرسومة بأسلوب الخلفية */
.ico{display:block;filter:drop-shadow(0 2px 0 rgba(59,51,64,.18))}
.nav{background:#fff8ec;width:44px;height:44px;border-radius:14px;margin:2px 0}
.nav:hover{background:#fff;transform:translateY(-2px) rotate(-4deg)}
.nav.on{background:#fff;box-shadow:0 0 0 3px var(--yellow)}
.nav.on::before{display:none}
.sidebar .s-logo{background:#fff;width:44px;height:44px;border-radius:14px}
.sidebar{background:#0b0c10;gap:5px;overflow-y:auto}
.badge{width:30px;height:30px;border-radius:9px;background:#fff8ec}
.sec .em{display:flex;justify-content:center}
.role span{display:flex;justify-content:center}
.role.on{background:#fff8ec}
.person .ic{background:#fff8ec!important}
.logo{background:#fff8ec}
.avatar{background:#fff8ec;width:40px;height:40px;border:3px solid var(--yellow);flex-shrink:0}
body{position:fixed;inset:0;width:100%}
.fish{direction:ltr}.fish .ftail{border-left:0!important;border-right:18px solid}
/* ===================== الجوال ===================== */
@media (max-width:760px){
  .window{width:100vw;height:100vh;height:100dvh;margin:0;border-radius:0;border:0}
  .grid-sec{grid-template-columns:repeat(2,1fr)}
  .row4{grid-template-columns:repeat(2,1fr);row-gap:12px}
  .stat:last-child{text-align:right}
  .people{grid-template-columns:1fr}
  .letters{grid-template-columns:repeat(5,1fr)}
  .sidebar{width:54px}
  .opts{grid-template-columns:1fr}
  .levels{grid-template-columns:1fr}
  .cube-wrap{width:64px;height:64px}
  .face{width:64px;height:64px;font-size:21px}
  .f1{transform:translateZ(32px)}.f2{transform:rotateY(90deg) translateZ(32px)}.f3{transform:rotateY(180deg) translateZ(32px)}
  .f4{transform:rotateY(-90deg) translateZ(32px)}.f5{transform:rotateX(90deg) translateZ(32px)}.f6{transform:rotateX(-90deg) translateZ(32px)}
}
@media print{
  body *{visibility:hidden}
  .printable,.printable *{visibility:visible}
  .printable{position:absolute;inset:0;background:#fff;color:#000}
}

@media (max-width:760px){
  body::before{display:none}
  body{background:#cfe9fb}
  .card,.card-head,.pill,.tab,.back,.login-card{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  .card{background:rgba(40,64,90,.82)}
  .card-head{background:rgba(24,34,46,.85)}
  .main{-webkit-overflow-scrolling:touch}
  .window::after{display:none}
}
.sec,.unit,.lesson,.nav,.chip,.opt,.tab,.lt,.tile,.fish,.lvl,.role{cursor:pointer;-webkit-tap-highlight-color:rgba(255,216,77,.3);touch-action:manipulation}
</style>
</head>
<body>

<div class="window">

  <!-- ============ شاشة الدخول ============ -->
  <section id="login">
    <div class="login-card">
      <div class="logo"><i data-ic="logo" data-s="40"></i></div>
      <h1 class="title-font">مرحباً بكِ في لغتي السعادة</h1>
      <p class="sub">منصة لغتي للصف الثاني ابتدائي<br>تعلّم ممتع.. قصص، ألعاب، وتمارين تفاعلية</p>
      <div class="roles">
        <button class="role on" data-role="طالبة"><span><i data-ic="student" data-s="30"></i></span>دخول طالبة</button>
        <button class="role" data-role="معلمة"><span><i data-ic="teach" data-s="30"></i></span>دخول معلمة</button>
        <button class="role" data-role="زائرة"><span><i data-ic="visitor" data-s="30"></i></span>دخول زائرة</button>
      </div>
      <div class="or">أو</div>
      <input class="field" id="lName" placeholder="اكتبي اسمكِ هنا" autocomplete="off">
      <input class="field" id="lPass" type="password" placeholder="رمز المعلمة" style="display:none">
      <div class="err" id="lErr"></div>
      <button class="btn-main" id="lGo">ابدئي الرحلة ✨</button>
      <div class="login-foot">المعلمة <b>فاطمة شراحيلي</b> · المديرة <b>صالحة السهلي</b></div>
    </div>
    <div class="terms">بالدخول تُسجَّل زيارتكِ لقياس أثر المنصة 💛</div>
  </section>

  <section id="welcome"><h2 class="title-font" id="wText"></h2></section>

  <!-- ============ التطبيق ============ -->

function game() {

function play(li) {
  const L = LEVELS[li];

  };
