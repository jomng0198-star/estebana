<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استبانات الطفولة المبكرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== خط علي مشرف =====
     ضعي ملف الخط بجانب هذه الصفحة باسم AliMosharraf.ttf (أو .woff2 / .otf)
     وسيُستخدم تلقائياً. إن كان الخط مثبتاً على الجهاز سيُستخدم أيضاً. */
  @font-face{
    font-family:"Ali Mosharraf";
    src:local("Ali Mosharraf"),local("AliMosharraf"),local("علي مشرف"),
        url("AliMosharraf.woff2") format("woff2"),
        url("AliMosharraf.ttf") format("truetype"),
        url("AliMosharraf.otf") format("opentype");
    font-display:swap;
  }
  :root{
    --ink:#5A2318;
    --orange:#F2894E;
    --blue:#7FB0EA;
    --yellow:#F7C84A;
    --green:#6FAE5E;
    --font:"Tajawal",system-ui,sans-serif;
    --title:"Tajawal",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff;height:100%}
  body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}

  /* ===== شاشة عرضية: الشبكة في المنتصف تماماً مثل المقطع ===== */
  .screen{min-height:100vh;display:grid;place-items:center;padding:4vh 16px}
  .stage{
    --h:min(90vh, calc((100vw - 32px) * 1.2526));
    --u:calc(var(--h) / 595);          /* وحدة القياس = بكسل واحد في المقطع */
    position:relative;height:var(--h);width:calc(var(--h) * .7983);
  }
  .grid{
    display:grid;height:100%;
    grid-template-columns:255fr 207fr;   /* العمود الطويل يسار مثل المقطع */
    grid-template-rows:190fr 190fr 187fr;
    gap:calc(var(--u) * 14);
  }
  .card{
    position:relative;overflow:hidden;
    border-radius:calc(var(--u) * 14);
    padding:calc(var(--u) * 16) calc(var(--u) * 19);
    opacity:0;transform:translateY(14px);
  }
  .started .card{animation:up .7s ease forwards}
  .card.done{animation:none;opacity:1;transform:none}
  .c1{grid-column:2;grid-row:1/3;background:var(--orange)}
  .started .c1{animation-delay:.1s}.started .c2{animation-delay:.2s}.started .c3{animation-delay:.3s}.started .c4{animation-delay:.4s}
  .c2{grid-column:1;grid-row:1;background:var(--blue)}
  .c3{grid-column:1;grid-row:2;background:var(--yellow)}
  .c4{grid-column:1/3;grid-row:3;background:var(--green)}
  @keyframes up{to{opacity:1;transform:none}}

  .txt{position:relative;z-index:6}
  .card h2{font-family:var(--title);font-size:calc(var(--u) * 17);font-weight:800;line-height:1.35;margin-bottom:calc(var(--u)*5)}
  .card p{font-size:calc(var(--u) * 9.6);font-weight:500;line-height:1.55;max-width:30ch;color:#3a140c}
  .btn{
    display:inline-flex;align-items:center;gap:calc(var(--u)*5);
    margin-top:calc(var(--u)*9);padding:calc(var(--u)*5.5) calc(var(--u)*11);
    background:var(--ink);color:#fff;border:0;cursor:pointer;font-family:var(--font);
    font-weight:800;font-size:calc(var(--u) * 9.4);border-radius:99px;
    box-shadow:0 calc(var(--u)*3) 0 rgba(0,0,0,.15);
    transition:transform .18s, box-shadow .18s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 calc(var(--u)*4.5) 0 rgba(0,0,0,.15)}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .btn svg{width:1.2em;height:1.2em;transition:transform .2s}
  .btn:hover svg{transform:translateX(-3px)}

  .art{position:absolute;z-index:1;pointer-events:none;overflow:visible}
  /* المواضع مأخوذة من المقطع */
  .c1 .art{left:0;width:96%;top:57%;height:38%}
  .c2 .art{left:5%;width:47%;top:36%;height:60%}
  .c3 .art{left:10%;width:42%;top:44%;height:52%}
  .c4 .art{left:3.5%;width:22%;top:16%;height:72%}

  /* بطاقة الهوية */
  .c4{display:flex;align-items:center;justify-content:flex-start}
  .id{display:flex;align-items:center;gap:calc(var(--u)*12)}
  .id img{height:calc(var(--u)*120);width:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
  .id h2{max-width:15em;font-size:calc(var(--u) * 16);margin-bottom:calc(var(--u)*7)}
  .staff{display:grid;gap:calc(var(--u)*4)}
  .staff div{font-size:calc(var(--u)*9.4);font-weight:700;color:#3a140c}
  .staff b{display:inline-block;min-width:calc(var(--u)*64);text-align:center;font-weight:800;color:#fff;background:var(--ink);padding:calc(var(--u)*1.5) calc(var(--u)*7);border-radius:99px;margin-left:calc(var(--u)*5);font-size:.9em}
  .staff span{font-size:calc(var(--u)*10.5);font-weight:800}

  /* الشريط الأبيض */
  .ribbon{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
  .ribbon path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ribbon .glow{stroke:rgba(255,255,255,.4);stroke-width:21}
  .ribbon .core{stroke:#fff;stroke-width:14}
  .ribbon .brush{stroke-width:1.1;stroke-linecap:butt;opacity:0}
  .started .ribbon .brush{animation:show .6s 2.9s forwards}
  .ribbon .b1{stroke:rgba(247,200,74,.9);stroke-dasharray:9 4 3 6;transform:translate(1.5px,-1px)}
  .ribbon .b2{stroke:rgba(230,150,40,.55);stroke-dasharray:4 7 12 3;transform:translate(-2px,1.5px)}
  .ribbon .b3{stroke:rgba(242,137,78,.6);stroke-dasharray:6 3 2 5}
  @keyframes show{to{opacity:1}}
  .ribbon .draw{stroke-dasharray:1;stroke-dashoffset:1}
  .started .ribbon .draw{animation:draw 2.6s .6s cubic-bezier(.6,.05,.25,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* ===== الجوال (عمودي) ===== */
  /* ===== الجوال: نفس التصميم بالضبط مع تكبير بسيط للنص ===== */
  @media (max-width:640px){
    .screen{padding:12px 10px}
    .stage{--h:min(92vh, calc((100vw - 20px) * 1.2526))}
    .card{padding:9px 10px}
    .card p{display:none}
    .card h2{font-size:max(calc(var(--u) * 17), 13px);margin-bottom:4px}
    .btn{font-size:max(calc(var(--u) * 9.4), 11px);padding:6px 11px;margin-top:6px}
    .id{gap:8px}
    .id img{height:max(calc(var(--u)*120), 80px)}
    .id h2{font-size:max(calc(var(--u) * 16), 12px)}
    .staff div{font-size:max(calc(var(--u)*9.4), 9px)}
    .staff span{font-size:max(calc(var(--u)*10.5), 10px)}
    .staff b{min-width:0}
  }

  /* ===== النموذج التفاعلي ===== */
  .ov{position:fixed;inset:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);
      display:none;align-items:center;justify-content:center;padding:16px}
  .ov.open{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}}
  .sheet{
    position:relative;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;
    background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(90,35,24,.22);
    animation:pop .35s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{from{transform:translateY(20px) scale(.97);opacity:0}}
  .sh-top{position:relative;background:var(--c);padding:22px 26px 26px;border-radius:24px 24px 0 0;overflow:hidden}
  .sh-top::after{content:"";position:absolute;left:70px;bottom:-10px;width:120px;height:70px;
    background:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 50%) 0 0/12px 12px;opacity:.85;border-radius:14px}
  .sh-top small{font-size:13px;font-weight:700;background:rgba(255,255,255,.55);padding:3px 11px;border-radius:99px}
  .sh-top h3{font-family:var(--title);font-size:26px;margin-top:10px;position:relative;z-index:1}
  .x{position:absolute;top:16px;left:16px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;
     background:rgba(255,255,255,.65);color:var(--ink);font-size:22px;line-height:1}
  .bar{height:8px;background:rgba(90,35,24,.1);border-radius:99px;margin:20px 26px 0;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width .4s ease}
  .step{padding:20px 26px 8px;min-height:250px}
  .step .n{font-size:13px;color:#9a6a5c;font-weight:700}
  .step h4{font-size:21px;line-height:1.5;margin:6px 0 18px}
  .q-in{animation:slide .35s ease}
  @keyframes slide{from{opacity:0;transform:translateX(-24px)}}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:2px solid #f0e2d8;border-radius:16px;cursor:pointer;
       font-size:16px;font-family:var(--font);background:#fff;color:var(--ink);text-align:right;transition:.15s}
  .opt:hover{border-color:var(--c)}
  .opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center}
  .opt.multi .dot{border-radius:7px}
  .opt.on{background:var(--c);border-color:var(--c)}
  .opt.on .dot{background:var(--ink)}
  .opt.on .dot::after{content:"";width:8px;height:8px;border-radius:2px;background:#fff}
  .faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .face{border:2px solid #f0e2d8;background:#fff;border-radius:18px;padding:12px 4px 8px;cursor:pointer;font-family:var(--font);
        color:var(--ink);font-size:12.5px;display:grid;justify-items:center;gap:6px;transition:.15s}
  .face svg{width:44px;height:44px}
  .face:hover{transform:translateY(-3px);border-color:var(--c)}
  .face.on{background:var(--c);border-color:var(--c);transform:translateY(-3px) scale(1.04)}
  textarea{width:100%;min-height:130px;border:2px solid #f0e2d8;border-radius:16px;padding:14px;font:16px/1.7 var(--font);color:var(--ink);resize:vertical}
  textarea:focus{outline:none;border-color:var(--c)}
  .nav{display:flex;justify-content:space-between;gap:10px;padding:16px 26px 24px}
  .nb{font-family:var(--font);font-weight:700;font-size:16px;border:0;border-radius:99px;padding:12px 24px;cursor:pointer;transition:.15s}
  .nb.next{background:var(--ink);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.15)}
  .nb.next:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  .nb.back{background:#f6eee8;color:var(--ink)}
  .nb.back[hidden]{display:block;visibility:hidden}
  .hint{font-size:12.5px;color:#a07a6e;margin-top:10px}
  .done-box{text-align:center;padding:34px 26px 30px}
  .done-box svg{width:120px;height:120px}
  .done-box h4{font-family:var(--title);font-size:28px;margin:10px 0 6px}
  .done-box p{color:#7b4a3e;font-size:15.5px;line-height:1.8}
  .conf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;border-radius:2px;animation:fall linear forwards;pointer-events:none}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>

document.querySelectorAll('.card').forEach(c=>c.addEventListener('animationend',()=>c.classList.add('done')));

/* ===== الوجوه ===== */
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const FACE_LABELS=["غير راضٍ","مقبول","جيد","جيد جداً","ممتاز"];
function face(i){
  const m=["M15 33 q9 -7 18 0","M15 32 q9 -3 18 0","M15 31 h18","M15 30 q9 5 18 0","M13 28 q11 10 22 0"][i];
  const fills=["#F6B9A8","#F8CFA0","#F7E09A","#C9E4A6","#A9DB8E"];
  return `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="${fills[i]}" stroke="#5A2318" stroke-width="2"/>
    <circle cx="17" cy="20" r="2.4" fill="#5A2318"/><circle cx="31" cy="20" r="2.4" fill="#5A2318"/>
    <path d="${m}" fill="none" stroke="#5A2318" stroke-width="2.4" stroke-linecap="round"/></svg>`;
}

/* ===== منطق الاستبانة ===== */
const ov=document.getElementById('ov'), sheet=document.getElementById('sheet');
let F=null, idx=0, ans=[];

grid.addEventListener('click',e=>{const b=e.target.closest('.btn');if(b)openForm(+b.dataset.f)});
ov.addEventListener('click',e=>{if(e.target===ov)closeForm()});
document.addEventListener('keydown',e=>{if(!ov.classList.contains('open'))return;
  if(e.key==='Escape')closeForm();
  if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){const n=sheet.querySelector('.next');if(n&&!n.disabled)n.click()}});

function openForm(i){F=FORMS[i];idx=0;ans=F.questions.map(q=>q.type==='multi'?[]:'');
  sheet.style.setProperty('--c',F.color);ov.classList.add('open');document.body.style.overflow='hidden';render()}
function closeForm(){ov.classList.remove('open');document.body.style.overflow=''}

function answered(){const a=ans[idx],q=F.questions[idx];return q.type==='text'||(Array.isArray(a)?a.length>0:a!=='')}

function render(){
  const q=F.questions[idx],t=F.questions.length,a=ans[idx];
  let body='';
  if(q.type==='faces') body=`<div class="faces">${FACE_LABELS.map((l,k)=>`<button class="face ${a===l?'on':''}" data-v="${l}">${face(k)}${l}</button>`).join('')}</div>`;
  else if(q.type==='choice'||q.type==='yesno'){const o=q.type==='yesno'?['نعم','لا']:q.options;
    body=`<div class="opts">${o.map(v=>`<button class="opt ${a===v?'on':''}" data-v="${v}"><span class="dot"></span>${v}</button>`).join('')}</div>`}
  else if(q.type==='multi') body=`<div class="opts">${q.options.map(v=>`<button class="opt multi ${a.includes(v)?'on':''}" data-v="${v}"><span class="dot"></span>${v}</button>`).join('')}</div><p class="hint">يمكنك اختيار أكثر من إجابة</p>`;
  else body=`<textarea placeholder="اكتب هنا… (اختياري)">${a}</textarea>`;

  sheet.innerHTML=`
    <div class="sh-top"><button class="x" aria-label="إغلاق">×</button><small>${ar(idx+1)} من ${ar(t)}</small><h3>${F.title}</h3></div>
    <div class="bar"><i style="width:${idx/t*100}%"></i></div>
    <div class="step q-in"><div class="n">السؤال ${ar(idx+1)}</div><h4>${q.q}</h4>${body}</div>
    <div class="nav"><button class="nb back" ${idx?'':'hidden'}>السابق</button>
      <button class="nb next" ${answered()?'':'disabled'}>${idx===t-1?'إرسال':'التالي'}</button></div>`;
  requestAnimationFrame(()=>{const i=sheet.querySelector('.bar i');if(i)i.style.width=((idx+(answered()?1:0))/t*100)+'%'});

  sheet.querySelector('.x').onclick=closeForm;
  sheet.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if(q.type==='multi'){const s=ans[idx];s.includes(v)?s.splice(s.indexOf(v),1):s.push(v)}
    else ans[idx]=v;
    render();
    if(q.type!=='multi'&&idx<t-1)setTimeout(()=>{idx++;render()},320);
  });
  const ta=sheet.querySelector('textarea'); if(ta){ta.oninput=()=>ans[idx]=ta.value;ta.focus()}
  sheet.querySelector('.back').onclick=()=>{idx--;render()};
  sheet.querySelector('.next').onclick=()=>{if(idx<t-1){idx++;render()}else submit()};
}

function submit(){
  if(F.googleAction){
    const fd=new FormData();
    F.questions.forEach((q,i)=>{if(!q.entry)return;[].concat(ans[i]).forEach(v=>v&&fd.append(q.entry,v))});
    fetch(F.googleAction,{method:'POST',mode:'no-cors',body:fd}).catch(()=>{});
  }
  sheet.innerHTML=`
    <div class="sh-top"><button class="x" aria-label="إغلاق">×</button><small>تم</small><h3>${F.title}</h3></div>
    <div class="done-box q-in">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="${F.color}"/><circle cx="60" cy="60" r="52" fill="none" stroke="#5A2318" stroke-width="3"/>
        <path d="M38 62 l15 15 30 -32" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h4>شكراً لك!</h4><p>وصلتنا إجابتك، ورأيك يساعدنا على تقديم الأفضل لأطفالنا.</p>
      <div class="nav" style="justify-content:center"><button class="nb next" id="fin">العودة للصفحة</button></div>
    </div>`;
  sheet.querySelector('.x').onclick=closeForm; sheet.querySelector('#fin').onclick=closeForm;
  confetti();
}
function confetti(){const c=['#F2894E','#7FB0EA','#F7C84A','#6FAE5E','#B8352B'];
  for(let i=0;i<70;i++){const d=document.createElement('i');d.className='conf';
    d.style.left=Math.random()*100+'vw';d.style.background=c[i%5];
    d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=Math.random()*.4+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}}
</script>
</body>
</html>
